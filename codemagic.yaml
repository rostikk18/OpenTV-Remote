workflows:
  ios-unsigned-sideloadly:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build unsigned .app
        script: |
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" ! -path "*/*.xcodeproj/*" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{getline; print $1; exit}')
            TARGET_FLAG="-workspace $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{getline; print $1; exit}')
            TARGET_FLAG="-project $PROJECT"
          else
            echo "Проект не найден"
            exit 1
          fi

          # Запускаем сборку в Debug и сохраняем полный лог в файл, а на экран выводим только ошибки
          set -o pipefail
          xcodebuild build \
            $TARGET_FLAG \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -solver-expression-time-threshold=120 -Xfrontend -solver-memory-threshold=1000000000" \

            | tee build.log | grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" -C 2

      - name: Package .app into .ipa
        script: |
          mkdir -p build/ipa/Payload
          cp -r build/derived/Build/Products/Debug-iphoneos/*.app build/ipa/Payload/
          cd build/ipa
          zip -r unsigned_app.ipa Payload

    artifacts:
      - build/ipa/*.ipa

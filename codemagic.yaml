workflows:
  ios-unsigned-sideloadly:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        # Укажите имя вашего .xcworkspace (если используете CocoaPods) или .xcodeproj
        XCODE_WORKSPACE: "swiftly.xcworkspace"
        XCODE_SCHEME: "swiftly"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build unsigned .app
        script: |
          # Если у вас нет CocoaPods, замените -workspace "$XCODE_WORKSPACE" на -project "ВашеИмя.xcodeproj"
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into .ipa
        script: |
          mkdir -p build/ipa/Payload
          cp -r build/derived/Build/Products/Release-iphoneos/*.app build/ipa/Payload/
          cd build/ipa
          zip -r unsigned_app.ipa Payload

    artifacts:
      - build/ipa/*.ipa

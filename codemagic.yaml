workflows:
  ios-unsigned-sideloadly:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build unsigned .app
        script: |
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" ! -path "*/*.xcodeproj/*" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "Найден workspace: $WORKSPACE"
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{getline; print $1; exit}')
            echo "Используется схема: $SCHEME"
            xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/derived \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              OTHER_SWIFT_FLAGS="-Xfrontend -solver-expression-time-threshold=120 -Xfrontend -solver-memory-threshold=1000000000"
          elif [ -n "$PROJECT" ]; then
            echo "Найден project: $PROJECT"
            SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{getline; print $1; exit}')
            echo "Используется схема: $SCHEME"
            xcodebuild build \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/derived \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              OTHER_SWIFT_FLAGS="-Xfrontend -solver-expression-time-threshold=120 -Xfrontend -solver-memory-threshold=1000000000"
          else
            echo "Ошибка: файлы .xcworkspace или .xcodeproj не найдены!"
            ls -la
            exit 1
          fi

      - name: Package .app into .ipa
        script: |
          mkdir -p build/ipa/Payload
          cp -r build/derived/Build/Products/Release-iphoneos/*.app build/ipa/Payload/
          cd build/ipa
          zip -r unsigned_app.ipa Payload

    artifacts:
      - build/ipa/*.ipa
